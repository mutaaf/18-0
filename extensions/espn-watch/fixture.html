<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture</title>
<!-- The extension's own stylesheet. Without this the fixture exercised the
     placement logic against an unstyled card, so every alignment assertion was
     measuring nothing. -->
<link rel="stylesheet" href="content.css">
<!--
  A page shaped like the one the extension runs on, so the row-finding can be
  tested without espn.com.

  It exists because of a specific bug: the card measured itself as part of the
  row it had just been inserted into, the row then failed its own test, and the
  card jumped to whichever row now sorted first — flickering between the top two
  rows at the debounce interval and impossible to click, because it was being
  destroyed and rebuilt under the pointer.

  So the fixture has what produced that: several rows, nested wrappers around
  each one (a section around a scroller around a list, all three of which can
  look like a carousel), and a mutation after load, which is what a React page
  does on its own.

  The nesting is not decorative. It is the depth measured off the live page —
  rail, outer, wrapper, wrapper, section, shelf block, container — with the
  section label a *direct child of the section* and the programme titles as
  headings *inside the tiles*. That is what broke the band: "the first ancestor
  containing a heading" answered with the carousel, because ten tile titles are
  headings too, and the band went inside the carousel between a label and the
  rail it labels.

  Open it with `node extensions/espn-watch/fixture-check.mjs`.
-->
<style>
  body { margin: 0; background: #0b0b0f; color: #fff; font: 14px system-ui; }
  .label { margin: 18px 24px 8px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .scroller { overflow-x: auto; }
  .rail { display: flex; align-items: center; padding: 0 12px 18px; list-style: none; margin: 0; }
  .tile { margin-right: 16px; }
  .tile { flex: 0 0 auto; width: 232px; }
  .thumb { position: relative; width: 232px; height: 130px; border-radius: 6px; background: #23232b; overflow: hidden; }
  /* Three overlays covering the same box — same width, same top edge, all wide
     enough to look like tiles in a row. This is what produced 301 false rows on
     the real page. */
  .thumb > i { position: absolute; inset: 0; display: block; }
  /* A heading, because a programme title is one on the real page — and a
     heading inside a tile is exactly what the band used to line itself up
     against. Styled flat so the tile's geometry is the same as it ever was. */
  h3.cap { margin: 8px 0 0; font-size: 13px; font-weight: 400; line-height: 1.25; }
  .sub { margin: 2px 0 0; font-size: 11px; color: #999; }
  /* What a real row does under a pointer, and what the card has to copy: a
     duration, a curve, and a transform that belongs to the page rather than to
     us. See `timingFrom` and `hoverLift`. */
  .thumb { transition: transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .tile:hover .thumb { transform: scale(1.07); }
</style>
</head>
<body>
  <div id="page"></div>

<script>
  // Three rows, wrapped the way the live page wraps them.
  const ROWS = ['Just for you', 'Live now', 'Also live'];
  const page = document.getElementById('page');

  function buildRow(title, tiles) {
    const rail = document.createElement('ul');
    rail.className = 'rail';
    for (let i = 0; i < tiles; i++) {
      const li = document.createElement('li');
      li.className = 'tile';
      const tall = i % 3 === 0
        ? '<h3 class="cap">A rather longer programme title that wraps onto three lines here</h3>'
        : '<h3 class="cap">A programme</h3>';
      li.innerHTML = `<div class="thumb"><i></i><i></i><i></i></div>${tall}<p class="sub">ESPN+</p>`;
      rail.appendChild(li);
    }

    const outer = document.createElement('div');
    outer.className = 'outer';
    outer.appendChild(rail);
    const inner = document.createElement('div');
    inner.appendChild(outer);
    const scroller = document.createElement('div');
    scroller.className = 'scroller';
    scroller.appendChild(inner);

    // The section label is a direct child of the section, which is the one
    // thing that tells it apart from the ten headings inside the tiles.
    const heading = document.createElement('h2');
    heading.className = 'label';
    heading.textContent = title;
    const section = document.createElement('section');
    section.className = 'carousel';
    section.append(heading, scroller);

    // The shelf block: one rail, and its parent holds all of them.
    const shelf = document.createElement('div');
    shelf.className = 'shelf';
    shelf.appendChild(section);
    return shelf;
  }

  for (const title of ROWS) page.appendChild(buildRow(title, 8));

  // A React page does not stop changing after first paint: rows arrive late,
  // and existing ones get replaced wholesale.
  setTimeout(() => page.appendChild(buildRow('Upcoming', 6)), 700);
  setTimeout(() => page.appendChild(buildRow('Replays', 5)), 1400);
  // Something unrelated re-renders, repeatedly. A card that re-derives its
  // position on every mutation walks; one that remembers does not.
  for (const at of [1000, 1600, 2200, 2700]) {
    setTimeout(() => {
      const noise = document.createElement('div');
      noise.textContent = '.';
      page.appendChild(noise);
    }, at);
  }

  // The extension's storage, stubbed. `content.js` is loaded as a plain script
  // below, so this has to exist before it runs.
  //
  // `?tile=0&band=1` drives either placement or both at once. `?placement=` is
  // still understood because the retired setting has to keep working: an
  // install that stored `header` must still come back as a band.
  const query = new URLSearchParams(location.search);
  const legacy = query.get('placement');
  const flag = (name, fallback) => (query.has(name) ? query.get(name) !== '0' : fallback);
  // `?off=topRight` switches one slot off, which is the state that makes a named
  // cell load-bearing: with auto-placement the slot after it slides into the
  // empty cell, and the bottom-left pill appears in the top right. With all four
  // on, auto-placement and named cells agree -- so the check that matters is
  // this one.
  const off = query.get('off');
  const stored = {
    matchUi: flag('match', true),
    ...(off ? { slots: { [off]: { show: false } } } : {}),
    ...(legacy
      ? { placement: legacy }
      : { placeTile: flag('tile', true), placeBand: flag('band', false) }),
  };

  // `?dead=1` reproduces a reloaded extension: the script is still in the page,
  // but its context is gone and every `chrome.*` call throws. That is the state
  // in which the panel stopped opening, because recording the open ran before
  // the panel was built.
  const dead = query.get('dead') === '1';
  const boom = () => { throw new Error('Extension context invalidated.'); };

  window.chrome = {
    // `runtime.id` is how `alive()` decides, so a dead context has none -- and
    // neither does it have `getURL`, which is what a bundled slot image needs.
    // Calling a method that is not there is the *new* way a dead context can
    // stop the card being placed, so the stub leaves it out rather than
    // stubbing it to null.
    runtime: dead
      ? {}
      : {
          id: 'fixture',
          // The fixture is loaded from the extension's own folder, so a bundled
          // path is already the right relative URL.
          getURL: (path) => path,
          onMessage: { addListener: () => {} },
        },
    storage: {
      local: {
        get: (defaults, cb) => (dead ? boom() : cb({ ...defaults, ...stored })),
        set: (_v, cb) => (dead ? boom() : cb?.()),
        remove: (_k, cb) => (dead ? boom() : cb?.()),
      },
      onChanged: { addListener: () => {} },
    },
  };
</script>

<script src="config.js"></script>
<script src="identity.js"></script>
<script src="content.js"></script>
<script>window.__ezRows = (typeof findRows === 'function') ? findRows().length : null;</script>

<script>
  /*
   * The assertions, reported through the title so `--dump-dom` can read them.
   *
   * Sampled over time rather than checked once: the failure this exists for was
   * a card that appeared, moved, and appeared again. A single snapshot after
   * two seconds would have passed while it was flickering.
   */
  const seen = {
    tile: { parents: new Set(), max: 0, moves: 0, last: undefined },
    band: { parents: new Set(), max: 0, moves: 0, last: undefined },
  };
  const ID = { tile: 'eighteen-zero-card', band: 'eighteen-zero-band' };

  const sample = () => {
    for (const which of ['tile', 'band']) {
      const found = document.querySelectorAll(`#${ID[which]}`);
      const state = seen[which];
      state.max = Math.max(state.max, found.length);
      for (const node of found) state.parents.add(node.parentElement);
      const now = found[0]?.parentElement ?? null;
      if (state.last !== undefined && now !== state.last) state.moves++;
      state.last = now;
    }
  };

  // Fixed timeouts rather than an interval: under Chrome's virtual clock a
  // self-rescheduling interval never lets the page go idle, and `--dump-dom`
  // waits for idle. The harness hung rather than failed, which is the worst
  // kind of test.
  for (let at = 200; at <= 3000; at += 100) setTimeout(sample, at);

  /*
   * With the context gone, the panel must still open.
   *
   * The control is asked for by id and tag rather than by a style class: the
   * markup around it is the thing most likely to be rewritten, and a probe
   * pinned to a class that no longer exists reports "no panel" and "no control"
   * together -- which is why both are reported, so a missing selector fails the
   * check instead of quietly testing nothing.
   */
  const control = () => document.querySelector(`#${ID.tile} button`);
  if (dead) setTimeout(() => control()?.click(), 2400);

  setTimeout(() => {
    sample();
    const card = document.getElementById(ID.tile);
    const band = document.getElementById(ID.band);
    const art = card?.querySelector('.ez-art');
    const tiles = [...document.querySelectorAll('.rail .tile')];
    const tallest = tiles.slice().sort(
      (a, b) => b.getBoundingClientRect().height - a.getBoundingClientRect().height,
    )[0];
    const firstShelf = document.querySelector('.shelf');
    const label = document.querySelector('.label');

    document.title = JSON.stringify({
      cards: document.querySelectorAll(`#${ID.tile}`).length,
      bands: document.querySelectorAll(`#${ID.band}`).length,
      maxCards: seen.tile.max,
      maxBands: seen.band.max,
      distinctParents: seen.tile.parents.size,
      moves: seen.tile.moves,
      bandMoves: seen.band.moves,
      inFirstRow: card?.parentElement === document.querySelector('.rail'),
      onScreenX: card ? Math.round(card.getBoundingClientRect().x) : null,
      isBand: Boolean(band?.classList.contains('ez-band')),
      rowsFound: window.__ezRows ?? null,

      // What the card copied off a neighbour, rather than what it chose.
      motion: card ? card.style.getPropertyValue('--ez-motion').trim() : null,
      lift: card ? card.style.getPropertyValue('--ez-lift').trim() : null,

      // **The band goes between two shelves, not inside one.** The bug this
      // catches put it inside the carousel, below the section label and above
      // the rail — which still "precedes the first rail", so the old check
      // passed while the band was in the wrong place entirely.
      bandParentIsPage: band ? band.parentElement === document.getElementById('page') : null,
      bandInsideShelf: band && firstShelf ? firstShelf.contains(band) : null,
      bandAboveLabel: band && label
        ? (band.compareDocumentPosition(label) & Node.DOCUMENT_POSITION_FOLLOWING) > 0
        : null,

      heights: {
        card: card ? Math.round(card.getBoundingClientRect().height) : null,
        minH: card ? getComputedStyle(card).minHeight : null,
        tallestTile: tallest ? Math.round(tallest.getBoundingClientRect().height) : null,
        anchorTile: (() => { const t = document.querySelector('.rail .tile'); return t ? Math.round(t.getBoundingClientRect().height) : null; })(),
      },
      cardTopDelta: card && tallest
        ? Math.round(card.getBoundingClientRect().top - tallest.getBoundingClientRect().top)
        : null,
      artTopDelta: (() => {
        // Compared against the *tallest* tile in the row. A centred rail only
        // leaves the tallest item at the top of the line, so a shorter one is
        // legitimately lower and would make this measure nothing.
        const thumb = tallest?.querySelector('.thumb');
        if (!art || !thumb) return null;
        return Math.round(art.getBoundingClientRect().top - thumb.getBoundingClientRect().top);
      })(),
      // Measured against the *section* label. A band that lined itself up with
      // a programme title inside a tile would land tens of pixels right of it.
      bandLeftDelta: band && label
        ? Math.round(band.getBoundingClientRect().left - label.getBoundingClientRect().left)
        : null,
      aboveFirstRow: band
        ? (band.compareDocumentPosition(document.querySelector('.rail')) & Node.DOCUMENT_POSITION_FOLLOWING) > 0
        : false,
      clickable: Boolean(art),
      bandClickable: Boolean(band?.querySelector('.ez-slot-pill')),
      deadControl: Boolean(control()),
      deadPanel: Boolean(document.getElementById('eighteen-zero-panel')),
      // The four corners: what landed in each named cell, and which quadrant of
      // the card it actually occupies.
      //
      // **Measured, not read off a class.** The class is assigned in JavaScript
      // and would still be there with the whole grid misplaced -- the failure
      // this model exists to prevent is a slot switched off letting the next one
      // slide into the empty cell, and that is only visible in the geometry.
      slots: (() => {
        const host = card?.querySelector('.ez-art') ?? band;
        if (!host) return null;
        const box = host.getBoundingClientRect();
        return ['ez-tl', 'ez-tr', 'ez-bl', 'ez-br'].map((cell) => {
          const node = host.querySelector(`.${cell}`);
          if (!node) return null;
          const b = node.getBoundingClientRect();
          return {
            type: node.className.split(' ')[1],
            right: b.left + b.width / 2 > box.left + box.width / 2,
            bottom: b.top + b.height / 2 > box.top + box.height / 2,
          };
        });
      })(),
      // The two placements are separate elements; one must not be the other's
      // parent, and neither may end up inside the other.
      tangled: Boolean(card && band && (card.contains(band) || band.contains(card))),
    });
  }, 3200);
</script>
</body>
</html>
