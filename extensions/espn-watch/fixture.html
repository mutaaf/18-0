<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture</title>
<!-- The extension's own stylesheet. Without this the fixture exercised the
     placement logic against an unstyled card, so every alignment assertion was
     measuring nothing. -->
<link rel="stylesheet" href="content.css">
<!--
  A page shaped like the one the extension runs on, so the row-finding can be
  tested without espn.com.

  It exists because of a specific bug: the card measured itself as part of the
  row it had just been inserted into, the row then failed its own test, and the
  card jumped to whichever row now sorted first — flickering between the top two
  rows at the debounce interval and impossible to click, because it was being
  destroyed and rebuilt under the pointer.

  So the fixture has what produced that: several rows, nested wrappers around
  each one (a section around a scroller around a list, all three of which can
  look like a carousel), and a mutation after load, which is what a React page
  does on its own.

  The nesting is not decorative. It is the depth measured off the live page —
  rail, outer, wrapper, wrapper, section, shelf block, container — with the
  section label a *direct child of the section* and the programme titles as
  headings *inside the tiles*. That is what broke the band: "the first ancestor
  containing a heading" answered with the carousel, because ten tile titles are
  headings too, and the band went inside the carousel between a label and the
  rail it labels.

  Open it with `node extensions/espn-watch/fixture-check.mjs`.
-->
<style>
  body { margin: 0; background: #0b0b0f; color: #fff; font: 14px system-ui; }
  .label { margin: 18px 24px 8px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .scroller { overflow-x: auto; }
  .rail { display: flex; align-items: center; padding: 0 12px 18px; list-style: none; margin: 0; }
  .tile { margin-right: 16px; }
  .tile { flex: 0 0 auto; width: 232px; }
  .thumb { position: relative; width: 232px; height: 130px; border-radius: 6px; background: #23232b; overflow: hidden; }
  /* Three overlays covering the same box — same width, same top edge, all wide
     enough to look like tiles in a row. This is what produced 301 false rows on
     the real page. */
  .thumb > i { position: absolute; inset: 0; display: block; }
  /* A heading, because a programme title is one on the real page — and a
     heading inside a tile is exactly what the band used to line itself up
     against. Styled flat so the tile's geometry is the same as it ever was. */
  h3.cap { margin: 8px 0 0; font-size: 13px; font-weight: 400; line-height: 1.25; }
  .sub { margin: 2px 0 0; font-size: 11px; color: #999; }
  /* What a real row does under a pointer, and what the card has to copy: a
     duration, a curve, and a transform that belongs to the page rather than to
     us. See `timingFrom` and `hoverLift`. */
  .thumb { transition: transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .tile:hover .thumb { transform: scale(1.07); }
</style>
</head>
<body>
  <div id="page"></div>

<script>
  // Three rows, wrapped the way the live page wraps them.
  const ROWS = ['Just for you', 'Live now', 'Also live'];
  const page = document.getElementById('page');

  function buildRow(title, tiles) {
    const rail = document.createElement('ul');
    rail.className = 'rail';
    for (let i = 0; i < tiles; i++) {
      const li = document.createElement('li');
      li.className = 'tile';
      const tall = i % 3 === 0
        ? '<h3 class="cap">A rather longer programme title that wraps onto three lines here</h3>'
        : '<h3 class="cap">A programme</h3>';
      li.innerHTML = `<div class="thumb"><i></i><i></i><i></i></div>${tall}<p class="sub">ESPN+</p>`;
      rail.appendChild(li);
    }

    const outer = document.createElement('div');
    outer.className = 'outer';
    outer.appendChild(rail);
    const inner = document.createElement('div');
    inner.appendChild(outer);
    const scroller = document.createElement('div');
    scroller.className = 'scroller';
    scroller.appendChild(inner);

    // The section label is a direct child of the section, which is the one
    // thing that tells it apart from the ten headings inside the tiles.
    const heading = document.createElement('h2');
    heading.className = 'label';
    heading.textContent = title;
    const section = document.createElement('section');
    section.className = 'carousel';
    section.append(heading, scroller);

    // The shelf block: one rail, and its parent holds all of them.
    const shelf = document.createElement('div');
    shelf.className = 'shelf';
    shelf.appendChild(section);
    return shelf;
  }

  for (const title of ROWS) page.appendChild(buildRow(title, 8));

  // A React page does not stop changing after first paint: rows arrive late,
  // and existing ones get replaced wholesale.
  setTimeout(() => page.appendChild(buildRow('Upcoming', 6)), 700);
  setTimeout(() => page.appendChild(buildRow('Replays', 5)), 1400);
  // Something unrelated re-renders, repeatedly. A card that re-derives its
  // position on every mutation walks; one that remembers does not.
  for (const at of [1000, 1600, 2200, 2700]) {
    setTimeout(() => {
      const noise = document.createElement('div');
      noise.textContent = '.';
      page.appendChild(noise);
    }, at);
  }

  // The extension's storage, stubbed. `content.js` is loaded as a plain script
  // below, so this has to exist before it runs.
  //
  // `?tile=0&band=1` drives either placement or both at once. `?placement=` is
  // still understood because the retired setting has to keep working: an
  // install that stored `header` must still come back as a band.
  const query = new URLSearchParams(location.search);
  const legacy = query.get('placement');
  const flag = (name, fallback) => (query.has(name) ? query.get(name) !== '0' : fallback);
  // `?off=topRight` switches one slot off, which is the state that makes a named
  // cell load-bearing: with auto-placement the slot after it slides into the
  // empty cell, and the bottom-left pill appears in the top right. With all four
  // on, auto-placement and named cells agree -- so the check that matters is
  // this one.
  const off = query.get('off');
  const stored = {
    matchUi: flag('match', true),
    ...(off ? { slots: { [off]: { show: false } } } : {}),
    ...(legacy
      ? { placement: legacy }
      : { placeTile: flag('tile', true), placeBand: flag('band', false) }),
  };

  // `?dead=1` reproduces a reloaded extension: the script is still in the page,
  // but its context is gone and every `chrome.*` call throws. That is the state
  // in which the panel stopped opening, because recording the open ran before
  // the panel was built.
  const dead = query.get('dead') === '1';
  const boom = () => { throw new Error('Extension context invalidated.'); };

  window.chrome = {
    // `runtime.id` is how `alive()` decides, so a dead context has none -- and
    // neither does it have `getURL`, which is what a bundled slot image needs.
    // Calling a method that is not there is the *new* way a dead context can
    // stop the card being placed, so the stub leaves it out rather than
    // stubbing it to null.
    runtime: dead
      ? {}
      : {
          id: 'fixture',
          // The fixture is loaded from the extension's own folder, so a bundled
          // path is already the right relative URL.
          getURL: (path) => path,
          onMessage: { addListener: () => {} },
        },
    storage: {
      local: {
        // Callback *or* promise, the way MV3's really is: `ezIdentity` awaits
        // it, and a stub that only takes a callback threw inside the panel's
        // consent row instead of answering it.
        //
        // `?dead=1` makes every one of them throw, which is a reloaded
        // extension: the script is still in the page and its context is gone.
        get: (defaults, cb) =>
          dead ? boom() : cb ? cb({ ...defaults, ...stored }) : Promise.resolve({ ...defaults, ...stored }),
        set: (_v, cb) => (dead ? boom() : cb ? cb() : Promise.resolve()),
        remove: (_k, cb) => (dead ? boom() : cb ? cb() : Promise.resolve()),
      },
      onChanged: { addListener: () => {} },
    },
  };
</script>

<script>
  // Anything that throws while the extension is loading, said out loud. The
  // report is written by a script that runs after these, so a throw in one of
  // them produces a page with no report and no reason -- which is a harness
  // that fails without saying why.
  window.__boot = [];
  addEventListener('error', (e) => {
    // `Script error.` with no file and no line is the opaque report a page gets
    // for a cross-origin script -- here, the panel's frame failing to load,
    // which is deliberate and is not a fault. Recording it as one made the
    // harness blame a broken extension for a working one.
    if (e.message === 'Script error.' && !e.filename) return;
    window.__boot.push(`${e.message} @ ${(e.filename || '').split('/').pop()}:${e.lineno}`);
  });

  /*
   * Only if nothing else spoke.
   *
   * A throw in the script that *writes* the report leaves nothing to write it,
   * and "it did not report" is the least useful thing a harness can say. So
   * this says why -- just before the report would have, and only while the
   * title is still the one the page loaded with.
   */
  setTimeout(() => {
    if (window.__boot.length && document.title === 'fixture') {
      document.title = JSON.stringify({ boot: window.__boot });
    }
  }, 3100);
</script>
<script src="config.js"></script>
<script src="identity.js"></script>
<script src="content.js"></script>
<script>window.__ezRows = (typeof findRows === 'function') ? findRows().length : null;</script>

<script>
  /*
   * The assertions, reported through the title so `--dump-dom` can read them.
   *
   * Sampled over time rather than checked once: the failure this exists for was
   * a card that appeared, moved, and appeared again. A single snapshot after
   * two seconds would have passed while it was flickering.
   */
  const seen = {
    tile: { parents: new Set(), max: 0, moves: 0, seenIn: null },
    band: { parents: new Set(), max: 0, moves: 0, seenIn: null },
  };
  const ID = { tile: 'eighteen-zero-card', band: 'eighteen-zero-band' };

  const sample = () => {
    for (const which of ['tile', 'band']) {
      const found = document.querySelectorAll(`#${ID[which]}`);
      const state = seen[which];
      state.max = Math.max(state.max, found.length);
      for (const node of found) state.parents.add(node.parentElement);
      // A *move* is "it was in A and now it is in B", not "it was not here and
      // now it is". Counting the appearance made the band fail the moment it
      // started waiting for the page to finish loading -- which is the fix for
      // a real bug, reported by this check as a regression it is not.
      const now = found[0]?.parentElement ?? null;
      if (now && state.seenIn && now !== state.seenIn) state.moves++;
      if (now) state.seenIn = now;
    }
  };

  // Fixed timeouts rather than an interval: under Chrome's virtual clock a
  // self-rescheduling interval never lets the page go idle, and `--dump-dom`
  // waits for idle. The harness hung rather than failed, which is the worst
  // kind of test.
  for (let at = 200; at <= 3000; at += 100) setTimeout(sample, at);

  /*
   * The panel, opened and then taken away again.
   *
   * Its frame points at the real embed, which this page must never wait for --
   * the harness passes `--host-resolver-rules` so that load fails instantly,
   * and the panel is removed long before the report so nothing is still
   * pending when Chrome decides the page is idle.
   */
  const panel = {};
  if (new URLSearchParams(location.search).get('panel')) {
    setTimeout(() => {
      openPanel('board');
      const node = document.getElementById('eighteen-zero-panel');
      const frame = node?.querySelector('.ez-frame');
      const tabs = [...(node?.querySelectorAll('.ez-tab') ?? [])];
      const cta = node?.querySelector('a.ez-panel-cta');

      panel.tabs = tabs.map((t) => t.textContent);
      panel.openedOn = frame?.getAttribute('src') ?? null;
      panel.openedHeight = frame?.style.height ?? null;
      panel.selected = tabs.find((t) => t.classList.contains('on'))?.textContent ?? null;
      panel.cta = cta ? { href: cta.href, target: cta.target, rel: cta.rel } : null;

      tabs.find((t) => t.textContent === 'Play')?.click();
      panel.switchedOn = frame?.getAttribute('src') ?? null;
      panel.switchedHeight = frame?.style.height ?? null;
      panel.switchedSelected = tabs.find((t) => t.classList.contains('on'))?.textContent ?? null;

      /*
       * The frame navigating *itself*.
       *
       * Following "See the board" on the result screen changes the frame's
       * location without touching `src`, so the panel's own switcher never
       * runs -- and the board used to render under a header still saying Play,
       * with `aria-selected` true on the wrong tab.
       *
       * Posted rather than called, because the message listener is the thing
       * under test, and it must move the *highlight* only: a framed page that
       * could navigate the panel could put it somewhere nobody chose.
       */
      // Dispatched with the frame's origin rather than posted, because a real
      // `postMessage` from this page carries *this* page's origin -- which the
      // listener refuses, as it should. Constructing the event is the only way
      // to exercise the path a real frame takes without being on its origin.
      const fromFrame = (screen) => window.dispatchEvent(new MessageEvent('message', {
        data: { source: '18-0', screen },
        origin: 'https://18-0.co',
      }));
      panel.afterSelfNav = { src: frame?.getAttribute('src') ?? null };

      // Somebody else's page, saying the same thing. It must be ignored.
      window.dispatchEvent(new MessageEvent('message', {
        data: { source: '18-0', screen: 'board' },
        origin: 'https://not-18-0.example',
      }));
      panel.afterStranger = tabs.find((t) => t.classList.contains('on'))?.textContent ?? null;

      fromFrame('board');

      // Read after the message has been delivered: `postMessage` is a task, not
      // a call, so anything read in the same turn reads the state before it.
      setTimeout(() => {
        panel.afterSelfNav.selected =
          tabs.find((t) => t.classList.contains('on'))?.textContent ?? null;
        panel.afterSelfNav.aria = tabs.map((t) => t.getAttribute('aria-selected'));
        panel.afterSelfNav.index = tabs.findIndex((t) => t.classList.contains('on'));
        panel.afterSelfNav.srcNow = frame?.getAttribute('src') ?? null;
        node?.remove();
      }, 0);
    }, 300);
  }

  /*
   * `?steal=1` -- the page taking one of ours over.
   *
   * This is what espn.com actually did, and it is not a hypothetical: the band
   * goes in as the first child of a container React hydrates, React matches a
   * container's existing children to its own by position, and it claimed our
   * div as the element for the shelf below -- emptied it and rendered the whole
   * carousel inside it. The node was still there, still had our id, still had
   * the parent we remembered, so every check said "settled" and the row sat
   * inside an enormous empty band until the page was reloaded.
   *
   * The two things that matter afterwards are asserted below: the shelf is
   * still on the page (deleting our node would have taken espn.com's own row
   * with it), and there is one band again, holding its own content.
   */
  /*
   * The best season, the way the frame reports it.
   *
   * Dispatched with the frame's origin rather than posted, for the reason the
   * panel's own check is: a real `postMessage` from this page carries this
   * page's origin, which the listener refuses -- correctly.
   */
  /*
   * `bestSeen`, not `best`.
   *
   * `content.js` is loaded here as a plain `<script>`, so its top-level `let`
   * and `const` share one lexical scope with this file's -- every name the
   * extension declares is a name this fixture may not. It collided with
   * `best`, and the whole page died with `Identifier 'best' has already been
   * declared` before a single timer was registered.
   */
  const bestSeen = {};
  if (new URLSearchParams(location.search).get('best') === '1') {
    setTimeout(() => {
      window.dispatchEvent(new MessageEvent('message', {
        data: { source: '18-0', best: { wins: 16, losses: 2, rating: 92.2 } },
        origin: 'https://18-0.co',
      }));
      setTimeout(() => {
        const card = document.getElementById(ID.tile);
        const band = document.getElementById(ID.band);
        const at = (host, cls) => {
          const n = host?.querySelector(`.${cls}`);
          if (!n || !host) return null;
          const a = n.getBoundingClientRect();
          const h = host.getBoundingClientRect();
          return {
            text: n.textContent,
            // Centred in its host, which is the whole claim: it takes no cell.
            dx: Math.round((a.left + a.width / 2) - (h.left + h.width / 2)),
            dy: Math.round((a.top + a.height / 2) - (h.top + h.height / 2)),
          };
        };
        bestSeen.tile = at(card?.querySelector('.ez-art'), 'ez-best');
        bestSeen.band = at(band, 'ez-best');
        bestSeen.ghosted = Boolean(band?.querySelector('.ez-best.ez-best-ghost'));
        bestSeen.hidden = document.querySelector('.ez-best')?.getAttribute('aria-hidden');
        // Nothing that was placed may have moved because of it.
        bestSeen.slots = ['ez-tl', 'ez-tr', 'ez-bl', 'ez-br']
          .map((c) => card?.querySelector(`.${c}`))
          .filter(Boolean)
          .map((n) => Math.round(n.getBoundingClientRect().left - card.getBoundingClientRect().left));
      }, 400);
    }, 1600);
  }

  const steal = {};
  if (new URLSearchParams(location.search).get('steal') === '1') {
    setTimeout(() => {
      const band = document.getElementById(ID.band);
      const shelf = band?.nextElementSibling;
      steal.ran = Boolean(band && shelf);
      if (!band || !shelf) return;
      steal.node = band;
      band.textContent = '';
      band.appendChild(shelf);
    }, 1400);
  }

  /*
   * With the context gone, the panel must still open.
   *
   * The control is asked for by id and tag rather than by a style class: the
   * markup around it is the thing most likely to be rewritten, and a probe
   * pinned to a class that no longer exists reports "no panel" and "no control"
   * together -- which is why both are reported, so a missing selector fails the
   * check instead of quietly testing nothing.
   */
  const control = () => document.querySelector(`#${ID.tile} button`);
  if (dead) setTimeout(() => control()?.click(), 2400);

  /*
   * Is the *whole* band the button?
   *
   * Asked with `elementFromPoint` rather than by dispatching a click, because
   * dispatching bypasses the thing under test. The covering button is a sibling
   * of the content, not an ancestor of it, so a synthetic click on the title
   * would never reach it however the CSS was written -- it is the browser's hit
   * test, walking `pointer-events` and z-order, that has to land on the button.
   * Sampled across the band rather than in the middle, because "clickable"
   * failing at the edges is exactly how a banner reads as broken.
   */
  function bandHits() {
    const band = document.getElementById(ID.band);
    const hit = band?.querySelector('.ez-band-hit');
    if (!band || !hit) return null;
    const box = band.getBoundingClientRect();
    const at = (x, y) => document.elementFromPoint(x, y);
    const lands = (node) => Boolean(node) && (node === hit || hit.contains(node));
    const y = box.top + box.height / 2;
    const points = {
      farLeft: lands(at(box.left + 6, y)),
      left: lands(at(box.left + box.width * 0.18, y)),
      middle: lands(at(box.left + box.width / 2, y)),
      right: lands(at(box.left + box.width * 0.82, y)),
      farRight: lands(at(box.right - 6, y)),
      top: lands(at(box.left + box.width / 2, box.top + 4)),
      bottom: lands(at(box.left + box.width / 2, box.bottom - 4)),
    };
    const title = band.querySelector('.ez-band-title');
    if (title) {
      const t = title.getBoundingClientRect();
      points.onTheWords = lands(at(t.left + t.width / 2, t.top + t.height / 2));
    }
    const cta = band.querySelector('a.ez-band-cta');
    let onTheLink = null;
    if (cta) {
      const c = cta.getBoundingClientRect();
      const node = at(c.left + c.width / 2, c.top + c.height / 2);
      onTheLink = node === cta || cta.contains(node);
    }
    return {
      points,
      onTheLink,
      buttons: band.querySelectorAll('button').length,
      // Against the band's *padding* box, which is what `inset: 0` resolves to
      // -- an absolutely positioned child is placed inside its containing
      // block's border, so a one-pixel border is not a gap in the target.
      covers:
        Math.round(hit.getBoundingClientRect().width - band.clientWidth) === 0
        && Math.round(hit.getBoundingClientRect().height - band.clientHeight) === 0,
      size: [
        Math.round(hit.getBoundingClientRect().width),
        Math.round(hit.getBoundingClientRect().height),
        band.clientWidth,
        band.clientHeight,
      ],
      ctaInsideButton: Boolean(cta?.closest('button')),
    };
  }

  setTimeout(() => {
    sample();
    const card = document.getElementById(ID.tile);
    const band = document.getElementById(ID.band);
    const art = card?.querySelector('.ez-art');
    const tiles = [...document.querySelectorAll('.rail .tile')];
    const tallest = tiles.slice().sort(
      (a, b) => b.getBoundingClientRect().height - a.getBoundingClientRect().height,
    )[0];
    const firstShelf = document.querySelector('.shelf');
    const label = document.querySelector('.label');

    if (window.__boot.length) { document.title = JSON.stringify({ boot: window.__boot }); return; }
    // Wrapped, because a throw anywhere in the object below leaves the page
    // with its original title and the harness saying only "it did not report".
    // A report that cannot be built should say what stopped it.
    try {
    document.title = JSON.stringify({
      cards: document.querySelectorAll(`#${ID.tile}`).length,
      bands: document.querySelectorAll(`#${ID.band}`).length,
      maxCards: seen.tile.max,
      maxBands: seen.band.max,
      distinctParents: seen.tile.parents.size,
      moves: seen.tile.moves,
      bandMoves: seen.band.moves,
      inFirstRow: card?.parentElement === document.querySelector('.rail'),
      onScreenX: card ? Math.round(card.getBoundingClientRect().x) : null,
      isBand: Boolean(band?.classList.contains('ez-band')),
      rowsFound: window.__ezRows ?? null,

      // What the card copied off a neighbour, rather than what it chose.
      motion: card ? card.style.getPropertyValue('--ez-motion').trim() : null,
      lift: card ? card.style.getPropertyValue('--ez-lift').trim() : null,

      // **The band goes between two shelves, not inside one.** The bug this
      // catches put it inside the carousel, below the section label and above
      // the rail — which still "precedes the first rail", so the old check
      // passed while the band was in the wrong place entirely.
      bandParentIsPage: band ? band.parentElement === document.getElementById('page') : null,
      bandInsideShelf: band && firstShelf ? firstShelf.contains(band) : null,
      bandAboveLabel: band && label
        ? (band.compareDocumentPosition(label) & Node.DOCUMENT_POSITION_FOLLOWING) > 0
        : null,

      heights: {
        card: card ? Math.round(card.getBoundingClientRect().height) : null,
        minH: card ? getComputedStyle(card).minHeight : null,
        tallestTile: tallest ? Math.round(tallest.getBoundingClientRect().height) : null,
        anchorTile: (() => { const t = document.querySelector('.rail .tile'); return t ? Math.round(t.getBoundingClientRect().height) : null; })(),
      },
      cardTopDelta: card && tallest
        ? Math.round(card.getBoundingClientRect().top - tallest.getBoundingClientRect().top)
        : null,
      artTopDelta: (() => {
        // Compared against the *tallest* tile in the row. A centred rail only
        // leaves the tallest item at the top of the line, so a shorter one is
        // legitimately lower and would make this measure nothing.
        const thumb = tallest?.querySelector('.thumb');
        if (!art || !thumb) return null;
        return Math.round(art.getBoundingClientRect().top - thumb.getBoundingClientRect().top);
      })(),
      // Measured against the *section* label. A band that lined itself up with
      // a programme title inside a tile would land tens of pixels right of it.
      bandLeftDelta: band && label
        ? Math.round(band.getBoundingClientRect().left - label.getBoundingClientRect().left)
        : null,
      aboveFirstRow: band
        ? (band.compareDocumentPosition(document.querySelector('.rail')) & Node.DOCUMENT_POSITION_FOLLOWING) > 0
        : false,
      clickable: Boolean(art),
      bandClickable: Boolean(band?.querySelector('.ez-slot-pill')),
      deadControl: Boolean(control()),
      deadPanel: Boolean(document.getElementById('eighteen-zero-panel')),
      // The four corners: what landed in each named cell, and which quadrant of
      // the card it actually occupies.
      //
      // **Measured, not read off a class.** The class is assigned in JavaScript
      // and would still be there with the whole grid misplaced -- the failure
      // this model exists to prevent is a slot switched off letting the next one
      // slide into the empty cell, and that is only visible in the geometry.
      slots: (() => {
        const host = card?.querySelector('.ez-art') ?? band;
        if (!host) return null;
        const box = host.getBoundingClientRect();
        return ['ez-tl', 'ez-tr', 'ez-bl', 'ez-br'].map((cell) => {
          const node = host.querySelector(`.${cell}`);
          if (!node) return null;
          const b = node.getBoundingClientRect();
          return {
            type: node.className.split(' ')[1],
            right: b.left + b.width / 2 > box.left + box.width / 2,
            bottom: b.top + b.height / 2 > box.top + box.height / 2,
            // Where along the line it sits. The strip has one row, so its
            // corners are ordered left to right rather than by quadrant.
            x: Math.round(b.left + b.width / 2 - box.left),
          };
        });
      })(),
      // The two placements are separate elements; one must not be the other's
      // parent, and neither may end up inside the other.
      tangled: Boolean(card && band && (card.contains(band) || band.contains(card))),

      // The frame contract, read off the table rather than restated here.
      frameHeights: typeof FRAME_HEIGHT === 'object' ? FRAME_HEIGHT : null,
      views: typeof VIEWS === 'object' ? VIEWS.map((v) => [v.key, v.url, v.height]) : null,
      panel,

      /*
       * The call to action, everywhere it can be.
       *
       * `insideButton` is the one that matters: the tile's play action is a
       * `<button>` and the artwork is all of it, so a link placed inside would
       * open the panel and follow the link on the same click.
       */
      tileCta: (() => {
        const a = card?.querySelector('a.ez-cta');
        if (!a) return null;
        return {
          text: a.textContent,
          href: a.href,
          target: a.target,
          rel: a.rel,
          insideButton: Boolean(a.closest('button')),
        };
      })(),
      bandCta: (() => {
        const a = band?.querySelector('a.ez-band-cta');
        return a ? { href: a.href, target: a.target, rel: a.rel } : null;
      })(),

      /*
       * The logo and the shine on it.
       *
       * `masked` is the whole treatment: without the mask the gloss is a
       * rectangle of light over a transparent PNG, which is a pane of glass in
       * front of the card rather than light on the mark. `natural` is the other
       * half -- the asset has to be several times the size it is drawn at or
       * the mark is soft on a 2x screen, and nothing else on the page would
       * ever notice.
       */
      tileLogo: (() => {
        const slot = card?.querySelector('.ez-logo');
        const img = slot?.querySelector('img.ez-logo-img');
        const gloss = slot?.querySelector('.ez-logo-gloss');
        if (!slot || !img || !gloss) return null;
        const style = getComputedStyle(gloss);
        const slotStyle = getComputedStyle(slot);
        return {
          src: img.getAttribute('src'),
          natural: img.naturalWidth,
          width: Math.round(slot.getBoundingClientRect().width),
          masked: (style.webkitMaskImage || style.maskImage || 'none') !== 'none',
          blend: style.mixBlendMode,
          // Both of these are built out of `calc()` on the pointer variables,
          // and a `calc()` the parser rejects drops the whole declaration
          // silently -- the logo simply goes flat and nothing says why.
          lifted: slotStyle.filter.includes('drop-shadow'),
          tilted: slotStyle.transform !== 'none',
          sweeping: style.backgroundImage.includes('gradient'),
          // The crest is the wordmark drawn, so it replaces it rather than
          // sitting next to a second copy of the same name.
          wordmark: Boolean(card.querySelector('.ez-mark')),
        };
      })(),
      bandLogo: Boolean(band?.querySelector('.ez-logo img.ez-logo-img')),
      // The band is a strip between two rows. Every line it grows is a line of
      // somebody else's page it pushes down.
      bandHeight: band ? Math.round(band.getBoundingClientRect().height) : null,
      // Where the four corners sit, so a run with the billboard can be held
      // against a run without it. That is the whole promise it makes.
      cornerLefts: card
        ? ['ez-tl', 'ez-tr', 'ez-bl', 'ez-br']
            .map((c) => card.querySelector(`.${c}`))
            .map((n) => (n ? Math.round(n.getBoundingClientRect().left - card.getBoundingClientRect().left) : null))
        : null,
      best: bestSeen.tile === undefined && bestSeen.band === undefined ? null : bestSeen,
      // One row, not two. Measured rather than read off the grid, because the
      // thing that matters is where the corners ended up.
      // Nothing in the strip may sit on anything else in it. "The corners are
      // overlapping" is a report nobody should have to make twice.
      bandOverlaps: (() => {
        if (!band) return null;
        const parts = ['ez-end-left', 'ez-end-right', 'ez-band-text']
          .map((c) => [c, band.querySelector(`.${c}`)])
          .filter(([, n]) => n)
          .map(([c, n]) => [c, n.getBoundingClientRect()]);
        const hits = [];
        for (let i = 0; i < parts.length; i++) {
          for (let j = i + 1; j < parts.length; j++) {
            const [an, a] = parts[i];
            const [bn, b] = parts[j];
            const x = Math.min(a.right, b.right) - Math.max(a.left, b.left);
            const y = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
            if (x > 1 && y > 1) hits.push(`${an}/${bn}`);
          }
        }
        return hits;
      })(),
      // The eighteen marks belong on the band's bottom edge, the width of it.
      bandLadder: (() => {
        const l = band?.querySelector('.ez-ladder');
        if (!band || !l) return null;
        const a = l.getBoundingClientRect();
        const b = band.getBoundingClientRect();
        return { wide: Math.round(b.width - a.width), fromBottom: Math.round(b.bottom - a.bottom) };
      })(),
      bandRows: (() => {
        if (!band) return null;
        const tops = ['ez-end-left', 'ez-end-right']
          .map((c) => band.querySelector(`.${c}`))
          .filter(Boolean)
          .map((n) => Math.round(n.getBoundingClientRect().top));
        return tops.length ? { spread: Math.max(...tops) - Math.min(...tops), n: tops.length } : null;
      })(),
      bandHit: bandHits(),

      steal: steal.ran === undefined ? null : {
        ran: steal.ran,
        // espn.com's own row, which must survive us letting go of the node it
        // now lives in.
        shelfAlive: document.querySelectorAll('.shelf').length,
        // The node the page took is no longer ours, and is still in the page.
        disowned: steal.node ? !steal.node.id && !steal.node.className : null,
        stillInPage: steal.node ? steal.node.isConnected : null,
        // And there is a band again, with its own content and no shelf in it.
        bands: document.querySelectorAll(`#${ID.band}`).length,
        bandHoldsShelf: band ? band.querySelectorAll('.shelf').length : null,
        bandHasCopy: Boolean(band?.textContent.trim()),
      },
    });
    } catch (e) {
      document.title = JSON.stringify({ reportFailed: String(e && e.message || e) });
    }
  }, 3200);
</script>
</body>
</html>
