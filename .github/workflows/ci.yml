name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # The scoring model is the product, so a change that moves the published
  # distribution should be a deliberate one. This re-measures it on every push.
  distribution:
    name: Rarity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 18-0 must stay rare, and 17-1 must stay reachable
        # Asserted, not printed. The rates are a function of the card pool, and
        # the pool has grown twice in a month -- each time silently falsifying
        # the front page until somebody happened to measure. The sample is
        # seeded, so this is a fixed number for a given dataset rather than
        # something that can flake; 400,000 games takes about twenty seconds and
        # reads close enough to the published figure to be worth asserting on.
        run: pnpm --filter @18-0/data tune -- --games=400000 --assert
