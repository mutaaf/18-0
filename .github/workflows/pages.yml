name: Deploy playable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export the web build
        working-directory: apps/mobile
        # A project site is served from /<repo>/, so the bundle has to be built
        # against that base path.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # The anon key is designed to be public — every guarantee that matters
          # is enforced by row level security and the edge functions, not by
          # keeping it secret. It lives in repository secrets so the value can be
          # rotated without a commit, not because exposure would breach anything.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir ../../dist
      - name: The link preview must survive the build
        # A share of this game is a URL in somebody's chat. The tags that make
        # that URL worth tapping live in apps/mobile/public/index.html, and the
        # first attempt at adding them put them somewhere Expo silently ignores
        # -- the build passed and the page shipped bare. This reads what ships.
        run: node scripts/verify/web-head.mjs dist

      - name: Serve the SPA on deep links
        # GitHub Pages has no rewrite rules; a copy of index.html as 404.html is
        # the standard way to make client-side routing survive a refresh.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
