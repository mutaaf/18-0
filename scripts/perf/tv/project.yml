# The Apple TV performance harness: a UI-test bundle with no app of its own.
# It drives the installed 17-0 app with XCUIRemote, the way a Siri Remote
# does, and records Apple's own metrics. Generated by scripts/perf/tv/run.sh
# into a scratch folder; nothing here is part of the app.
name: TVPerf
options:
  bundleIdPrefix: com.eighteenzerodcai.perf
targets:
  TVPerfUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources: [TVPerfUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  TVPerf:
    build:
      targets:
        TVPerfUITests: [test]
    test:
      targets: [TVPerfUITests]
