<!DOCTYPE html>
<!--

  This stub stays because the old address may already be linked or indexed, and

-->

    <meta name="robots" content="noindex, follow" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #06080f;
        color: #9aa4b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: #ffb400; }
    </style>
  </head>
  <body>
    <p>
      The privacy policy for 18-0 now lives at<br />
      <a href="https://digitalcraftai.com/privacy">digitalcraftai.com/privacy</a>

</html>
